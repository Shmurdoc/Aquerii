# docker-compose.override.yml — dev-only services
#
# This file is automatically merged by Docker Compose when running
# `docker compose up` in development. It adds services that should
# NEVER run in production: mail catcher, object-storage console,
# OTel debug exporter, and Vault in dev mode.
#
# In production (CI/CD), pass `-f docker-compose.yml` explicitly
# to skip this override file.

services:

  # ─── MAILPIT (Dev email catcher) ─────────────────────────────────────────
  # Catches all outbound SMTP from the API so you can inspect emails locally.
  # Access the UI at http://localhost:8025
  mailpit:
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

  # ─── MINIO CONSOLE ───────────────────────────────────────────────────────
  # The MinIO web console is already exposed on :9001 in the base file.
  # Override here to make the intent explicit and allow easy disablement.
  minio:
    ports:
      - "9000:9000"   # S3 API (for local SDK usage / awscli)
      - "9001:9001"   # MinIO console

  # ─── OTEL DEBUG EXPORTER ─────────────────────────────────────────────────
  # Logs all received spans/metrics/logs to stdout so you can inspect
  # telemetry without needing a full Jaeger/Loki stack.
  otel-collector:
    environment:
      OTEL_LOG_LEVEL: debug

  # ─── VAULT (Dev mode) ────────────────────────────────────────────────────
  # Vault starts in dev mode with a known root token; state is not persisted.
  # DO NOT use dev mode in production.
  vault:
    ports:
      - "8200:8200"   # Vault UI + API

  # ─── GRAFANA ─────────────────────────────────────────────────────────────
  # Allow anonymous access in dev so you don't need to log in every time.
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
