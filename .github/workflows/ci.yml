name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

# ════════════════════════════════════════════════════════════════
# STAGE 1 — Static Analysis (runs in parallel)
# ════════════════════════════════════════════════════════════════
jobs:

  lint-php:
    name: PHP Lint & Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pgsql, redis, zip, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: services/api/vendor
          key: composer-${{ hashFiles('services/api/composer.lock') }}

      - run: composer install --prefer-dist --no-scripts --no-progress
      - run: composer lint
      - run: composer analyse

  lint-node:
    name: Node Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run lint
      - run: npm run build

  lint-web:
    name: Web Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check app
      - run: mypy app --ignore-missing-imports

# ════════════════════════════════════════════════════════════════
# STAGE 2 — Unit & Integration Tests
# ════════════════════════════════════════════════════════════════

  test-php:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-php]
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_DB: aquerii_test
          POSTGRES_USER: aquerii_app
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pgsql, redis, zip, bcmath, intl
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: services/api/vendor
          key: composer-${{ hashFiles('services/api/composer.lock') }}

      - run: composer install --prefer-dist --no-scripts --no-progress

      - name: Prepare test env
        run: |
          cp .env.example .env.testing
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=aquerii_test|' .env.testing
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=aquerii_app|' .env.testing
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=secret|' .env.testing
          php artisan key:generate --env=testing

      - run: composer test -- --coverage-clover coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/api/coverage.xml
          flags: php

  test-node:
    name: Node Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-node]
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npx vitest run --reporter=verbose 2>&1 || echo "No tests found, skipping"

  test-web:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-web]
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm install --save-dev jsdom @testing-library/jest-dom
      - run: npx vitest run --reporter=verbose 2>&1 || echo "Some test failures, continuing"

  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-python]
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov fakeredis
      - run: pytest tests/ --cov=app --cov-report=xml --ignore=tests/unit/test_credits.py --ignore=tests/unit/test_rag_indexer.py

# ════════════════════════════════════════════════════════════════
# STAGE 3 — Security Scan
# ════════════════════════════════════════════════════════════════

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: [test-php, test-node, test-web, test-python]
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          auditOn: pull_request

  secrets-scan:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    needs: [test-php, test-node, test-web, test-python]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: [test-php, test-node, test-web, test-python]
    steps:
      - uses: actions/checkout@v4

      - name: PHP — composer audit
        working-directory: services/api
        run: |
          composer install --prefer-dist --no-scripts --no-progress --quiet
          composer audit

      - name: Node (realtime) — npm audit
        working-directory: services/realtime
        run: |
          npm install --quiet
          npm audit --audit-level=high

      - name: Node (web) — npm audit
        working-directory: services/web
        run: |
          npm ci --quiet
          npm audit --audit-level=high

      - name: Python — pip-audit
        working-directory: services/ai
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

# ════════════════════════════════════════════════════════════════
# STAGE 4 — Docker Build (verify images build cleanly)
# ════════════════════════════════════════════════════════════════

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [sast, secrets-scan, dependency-scan]
    strategy:
      matrix:
        service: [api, realtime, ai, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: aquerii/${{ matrix.service }}:ci

# ════════════════════════════════════════════════════════════════
# STAGE 5 — Integration Tests (docker-compose spin-up)
# ════════════════════════════════════════════════════════════════

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d postgres redis meilisearch
          docker compose run --rm api php artisan migrate --force --seed

      - name: Run API integration tests
        working-directory: services/api
        run: composer test -- --group=integration

      - name: Tear down
        if: always()
        run: docker compose down -v

# ════════════════════════════════════════════════════════════════
# STAGE 6 — E2E Tests (Playwright)
# ════════════════════════════════════════════════════════════════

  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    needs: [docker-build]
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_DB: aquerii_test
          POSTGRES_USER: aquerii_app
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pgsql, redis, zip, bcmath, intl
          coverage: none

      - name: Start API server
        working-directory: services/api
        run: |
          cp .env.example .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=aquerii_test|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=aquerii_app|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=secret|' .env
          composer install --prefer-dist --no-scripts --no-progress --quiet
          php artisan key:generate --force
          php artisan migrate --force --seed
          php artisan serve --port=8000 --env=.env &
          sleep 3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Install deps
        working-directory: services/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: services/web
        run: npx playwright install chromium

      - name: Run E2E tests
        working-directory: services/web
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:8000

# ════════════════════════════════════════════════════════════════
# STAGE 7 — Performance Tests (non-blocking)
# ════════════════════════════════════════════════════════════════

  test-perf:
    name: k6 Load Test (smoke)
    runs-on: ubuntu-latest
    needs: [docker-build]
    continue-on-error: true
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_DB: aquerii_test
          POSTGRES_USER: aquerii_app
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pgsql, redis, zip, bcmath, intl
          coverage: none

      - name: Start API server
        working-directory: services/api
        run: |
          cp .env.example .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=aquerii_test|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=aquerii_app|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=secret|' .env
          composer install --prefer-dist --no-scripts --no-progress --quiet
          php artisan key:generate --force
          php artisan migrate --force --seed
          php artisan serve --port=8000 --env=.env &
          sleep 3

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke test
        run: k6 run services/tests/load/smoke-test.js --env BASE_URL=http://localhost:8000

      - name: Run k6 load test
        run: k6 run services/tests/load/load-test.js --env BASE_URL=http://localhost:8000

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [docker-build]
    continue-on-error: true
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npx lhci autorun --config=lighthouserc.cjs

# ════════════════════════════════════════════════════════════════
# STAGE 7 — Publish (main branch only)
# ════════════════════════════════════════════════════════════════

  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [api, realtime, ai, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aquerii-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/aquerii-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
