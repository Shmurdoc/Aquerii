name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: africa-south1
  SERVICE_NAME_API: aquerii-api
  SERVICE_NAME_WORKER: aquerii-worker
  SERVICE_NAME_SCHEDULER: aquerii-scheduler
  PHP_VERSION: "8.3"

jobs:
  deploy-api:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - id: auth
      name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        token_format: access_token

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Configure Docker
      run: gcloud auth configure-docker gcr.io --quiet

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        dockerfile: services/api/Dockerfile
        push: true
        tags: |
          gcr.io/${{ env.PROJECT_ID }}/aquerii-api:latest
          gcr.io/${{ env.PROJECT_ID }}/aquerii-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy API service
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME_API }} \
          --image=gcr.io/${{ env.PROJECT_ID }}/aquerii-api:${{ github.sha }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --quiet

    - name: Deploy Worker service
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME_WORKER }} \
          --image=gcr.io/${{ env.PROJECT_ID }}/aquerii-api:${{ github.sha }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --quiet

    - name: Deploy Scheduler job
      run: |
        gcloud run jobs deploy ${{ env.SERVICE_NAME_SCHEDULER }} \
          --image=gcr.io/${{ env.PROJECT_ID }}/aquerii-api:${{ github.sha }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --quiet

    - name: Get deploy URLs
      run: |
        echo "## Cloud Run Deployments" >> $GITHUB_STEP_SUMMARY
        echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| API | https://${{ env.SERVICE_NAME_API }}-${{ env.PROJECT_ID }}-${{ env.REGION }}.a.run.app |" >> $GITHUB_STEP_SUMMARY
        echo "| Worker | https://${{ env.SERVICE_NAME_WORKER }}-${{ env.PROJECT_ID }}-${{ env.REGION }}.a.run.app |" >> $GITHUB_STEP_SUMMARY
        echo "| Scheduler | \`gcloud run jobs describe ${{ env.SERVICE_NAME_SCHEDULER }} --region=${{ env.REGION }}\` |" >> $GITHUB_STEP_SUMMARY
