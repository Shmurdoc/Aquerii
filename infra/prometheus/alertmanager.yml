global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-smtp.mailgun.org}:${SMTP_PORT:-587}'
  smtp_from: '${ALERT_FROM_EMAIL:-alerts@aquerii.app}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'default'

receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL:-ops@aquerii.app}'
        headers:
          Subject: '[Aquerii] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'
        html: |
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b><br>
          {{ .Annotations.description }}<br>
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          <br>
          {{ end }}
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        title: '[Aquerii] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: '${ONCALL_EMAIL:-oncall@aquerii.app}'
        headers:
          Subject: '[CRITICAL][Aquerii] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#oncall'
        title: ':fire: [CRITICAL][Aquerii] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
