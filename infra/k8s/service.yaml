# ─── API Service ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aquerii
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
# ─── Web Service ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: aquerii
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# ─── Realtime Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: aquerii
  labels:
    app: realtime
spec:
  type: ClusterIP
  selector:
    app: realtime
  ports:
    - name: ws
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
---
# ─── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aquerii-ingress
  namespace: aquerii
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # WebSocket upgrade for realtime
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: app.aquerii.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  name: ws
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
  tls:
    - hosts:
        - app.aquerii.app
      secretName: aquerii-tls
