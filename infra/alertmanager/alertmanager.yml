global:
  resolve_timeout: 5m

route:
  group_by: [alertname, severity, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: oncall-critical
      repeat_interval: 1h
      continue: true
    - match:
        severity: critical
      receiver: default
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: default

receivers:
  - name: default
    email_configs:
      - to: ops@aquerii.app
        send_resolved: true

  - name: oncall-critical
    email_configs:
      - to: oncall@aquerii.app
        send_resolved: true
        headers:
          Subject: '[CRITICAL][Aquerii] {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: http://localhost:9099/alert
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, job]
