[extend]
useDefault = true

[[allowlists]]
description = "Ignore gstack skill files and opencode config"
paths = [
    '''(.*)?\.opencode/''',
]

[[allowlists]]
description = "Doc example: idempotency_key assigned to a function call, not a secret"
regexes = [
    '''idempotency_key\s*=\s*request\.headers\.get''',
]
paths = [
    '''docs/plans/plans/ERROR_HANDLING\.md''',
]
